version: 0.2
env:
  variables:
    FRONTEND_BUCKET: "prizepicks-frontend-prod-696715200075"
    CLOUDFRONT_DIST_ID: "E24T537VAJX8RN"
    VITE_API_URL: "https://uglbx8p4l4.execute-api.eu-west-3.amazonaws.com/prod"
    VITE_PUBLIC_API_URL: "https://5gdrajqcvb.execute-api.eu-west-3.amazonaws.com/prod"
phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - npm ci
  build:
    commands:
      - npm run build
      - aws s3 sync dist/ s3://$FRONTEND_BUCKET --delete --exclude "index.html" --cache-control "public, max-age=31536000, immutable"
      - aws s3 cp dist/index.html s3://$FRONTEND_BUCKET/index.html --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html"
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/*"
