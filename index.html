<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OddsRivals</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Force a fresh network load on first open in Safari standalone (Add to Home Screen).
      // WKWebView can serve stale cached HTML that breaks script loading — this busts it.
      if (window.navigator.standalone && !sessionStorage.getItem('_sr')) {
        sessionStorage.setItem('_sr', '1');
        window.location.replace(window.location.href.split('?')[0] + '?_=' + Date.now());
      }
      // Reset viewport zoom after input blur (iOS stays zoomed after dismissing keyboard).
      document.addEventListener('focusout', function() {
        var mv = document.querySelector('meta[name="viewport"]');
        if (mv) {
          mv.setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover');
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
